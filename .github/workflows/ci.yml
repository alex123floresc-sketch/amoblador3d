# Compila, ejecuta las pruebas y genera el .jar en cada push o pull request.
# En Windows, porque es el sistema donde se usa la aplicación (y JavaFX trae partes nativas).
name: CI

on:
  push:
    branches: [main, "fase-*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, probar y medir cobertura
        run: .\mvnw.cmd -B verify
      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-y-cobertura
          path: |
            target/surefire-reports/
            target/site/jacoco/
      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: amoblador3d-jar
          path: target/amoblador3d.jar
